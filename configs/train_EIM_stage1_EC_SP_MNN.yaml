experiment: nexus_EC_stage1_SP_MNN_lr1e-3
resume: 

logger:
  status_freq: 10
  files_to_backup: ['train_extractor.py', 'val_extractor.py']
  dirs_to_backup: ['configs', 'core', 'datasets', 'utils']

setup:
  mixed_precision: false
  seed: 42
  cudnn_enabled: true
  allow_tf32: false
  num_threads: 8

  device: cuda
  gpus: [0]

  local_rank: -1

wandb:
  key: your_own_key
  project: test
  group: test
  name: ${experiment}
  notes: 
  tags: []

  dryrun: false


defaults:
  - _self_
  - dataset: ec
  - model: SP_MNN
  - train: train_stage1

